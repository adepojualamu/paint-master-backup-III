<!doctype html>
<html lang="en">
<head>
  <meta name="pm-mode" content="production">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../assets/img/favicon.png" />
  <title>Paint Masters — Dispatcher Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/admin.css" />
</head>
<body>
  <div class="admin-shell">
    <div id="admin-sidebar"></div>
    <div class="admin-main">
      <div id="admin-topbar"></div>
      <div class="main">

        <div class="page-head">
          <div>
            <h1>Paint Masters</h1>
            <div class="sub" id="artisanSub">All 12 Masters · <span id="availCount">0</span> available now</div>
          </div>
          <div class="page-actions">
            <button class="btn btn-outline" onclick="openMessageAll()">📧 Message all</button>
            <button class="btn btn-primary" onclick="openAddPainter()">＋ Add Paint Master</button>
          </div>
        </div>

        <!-- Filters -->
        <div class="filterbar">
          <input type="search" id="aSearch" placeholder="Search by name, specialty, region..." />
          <select class="sel" id="aSpec">
            <option value="">All specialties</option>
            <option>Interior</option><option>Decorative</option><option>Commercial</option><option>Epoxy</option><option>Roof</option>
          </select>
          <select class="sel" id="aRegion"><option value="">All regions</option></select>
          <select class="sel" id="aStatus">
            <option value="">Any status</option>
            <option value="available">Available</option>
            <option value="on_job">On a job</option>
            <option value="leave">On leave</option>
          </select>
        </div>

        <!-- Grid of artisan cards -->
        <div class="grid grid-3" id="artGrid"></div>

      </div>
    </div>
  </div>

  <!-- Detail modal -->
  <div id="artModal" class="hidden"></div>
  <!-- Stacked sub-action modal (Message / Calendar / Assign). Sits on top of
       artModal so closing the sub-action returns the user to the painter
       detail rather than the empty grid. -->
  <div id="artSubModal" class="hidden"></div>

  <script src="../assets/shared.js"></script>
  <script src="assets/admin-shared.js"></script>
  <script>
    adminMount('artisans');

    // In production the store is hydrated from the API after mount; re-render
    // the roster when that live data lands (no-op in demo mode).
    window.addEventListener('pmStoreReady', function () { try { render(); } catch (e) {} });

    const f = { search:'', spec:'', region:'', status:'' };

    // Deep-link: ?id=<artisanId> from the topbar search auto-opens the modal.
    (function deepLink() {
      try {
        const id = new URLSearchParams(location.search).get('id');
        if (id) setTimeout(() => { try { openArtisan(id); } catch (e) {} }, 30);
      } catch (e) {}
    })();

    function render() {
      const s = getStore();
      // Populate region dropdown
      if (!document.getElementById('aRegion').dataset.loaded) {
        const regions = [...new Set(s.artisans.map(a => a.region))].sort();
        document.getElementById('aRegion').insertAdjacentHTML('beforeend', regions.map(r=>`<option>${r}</option>`).join(''));
        document.getElementById('aRegion').dataset.loaded = '1';
      }
      const avail = s.artisans.filter(a => a.status === 'available').length;
      document.getElementById('availCount').textContent = avail;

      const rows = s.artisans.filter(a => {
        if (f.search) { const q=f.search.toLowerCase(); if (!(a.name+' '+a.specs.join(' ')+' '+a.region).toLowerCase().includes(q)) return false; }
        if (f.spec && !a.specs.includes(f.spec)) return false;
        if (f.region && a.region !== f.region) return false;
        if (f.status && a.status !== f.status) return false;
        return true;
      });

      const activeJobByArtisan = {};
      s.jobs.forEach(j => { if (j.assignedTo && ['dispatched','on_site','qa'].includes(j.stage)) activeJobByArtisan[j.assignedTo] = j; });

      document.getElementById('artGrid').innerHTML = rows.map(a => {
        const j = activeJobByArtisan[a.id];
        return `
          <div class="panel" style="cursor:pointer;" onclick="openArtisan('${a.id}')">
            <div class="panel-body">
              <div style="display:flex;align-items:center;gap:12px;">
                <div class="avatar" style="width:52px;height:52px;background:${a.color};font-size:1rem;">${a.initials}</div>
                <div style="flex:1;">
                  <h3 style="margin:0;font-size:1.05rem;">${a.name}</h3>
                  <div class="small">${a.region} · ${a.years} yrs · ★ ${a.rating}</div>
                </div>
                <span class="st ${a.status==='available'?'st-done':a.status==='on_job'?'st-site':'st-warn'}">
                  ${a.status==='on_job'?'On job':a.status==='available'?'Available':'On leave'}
                </span>
              </div>
              <div class="chip-group" style="margin-top:14px;">
                ${a.specs.map(sp=>`<span class="pill">${sp}</span>`).join('')}
              </div>
              <div class="flex-between" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--ink-100);">
                <div><div class="small">Jobs completed</div><strong>${a.jobs}</strong></div>
                <div><div class="small">Avg rating</div><strong style="color:var(--gold-500);">★ ${a.rating}</strong></div>
                <div><div class="small">Utilisation</div><strong>${Math.round(55 + (a.jobs % 40))}%</strong></div>
              </div>
              ${j ? `<div style="margin-top:14px;padding:10px;background:var(--ink-50);border-radius:8px;font-size:0.86rem;">
                <span class="small">Currently on:</span><br/>
                <strong>${j.service}</strong> · ${j.customer} <span class="st ${STAGE_BADGE[j.stage]}" style="margin-left:6px;">${STAGE_LABEL[j.stage]}</span>
              </div>`: ''}
            </div>
          </div>
        `;
      }).join('') || '<div class="panel"><div class="panel-body small">No Masters match your filters.</div></div>';
    }

    ['aSearch','aSpec','aRegion','aStatus'].forEach(id => {
      document.getElementById(id).addEventListener('input', e => {
        const key = id.replace('a','').toLowerCase();
        f[key] = e.target.value; render();
      });
    });

    function openArtisan(id) {
      const s = getStore();
      const a = artisanById(id);
      const jobs = s.jobs.filter(j => j.assignedTo === id);
      const activeJob = jobs.find(j => ['dispatched','on_site','qa'].includes(j.stage));
      const completed = jobs.filter(j => j.stage === 'completed');

      // 30-day availability (pseudo-random deterministic)
      let seed = a.id.charCodeAt(1) + a.years;
      function r(){ seed = (seed*9301+49297)%233280; return seed/233280; }
      let miniCal = '';
      for (let i=0;i<28;i++) {
        const x = r();
        const cls = x < 0.1 ? 'off' : x < 0.55 ? 'booked' : x < 0.75 ? 'busy' : '';
        miniCal += `<div class="d ${cls}" title="Day ${i+1}"></div>`;
      }

      const host = document.getElementById('artModal');
      host.classList.remove('hidden');
      host.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeArt()">
          <div class="modal" style="max-width:820px;">
            <div class="modal-head">
              <div style="display:flex;align-items:center;gap:14px;">
                <div class="avatar" style="width:52px;height:52px;background:${a.color};font-size:1rem;">${a.initials}</div>
                <div>
                  <h3>${a.name}</h3>
                  <div class="small">${a.region} · ${a.years} yrs · ★ ${a.rating} · ${a.jobs} jobs</div>
                </div>
              </div>
              <div class="close-btn" onclick="closeArt()">✕</div>
            </div>
            <div class="modal-body">
              <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">
                <div class="kpi"><div class="label">Completed</div><div class="value">${completed.length}</div></div>
                <div class="kpi"><div class="label">Avg rating</div><div class="value">★ ${a.rating}</div></div>
                <div class="kpi"><div class="label">On-time %</div><div class="value">${Math.round(92 + (a.jobs % 8))}%</div></div>
                <div class="kpi"><div class="label">QA pass 1st try</div><div class="value">${Math.round(88 + (a.years % 10))}%</div></div>
              </div>

              <h3 style="margin-top:20px;font-size:1rem;">Specialties & Certifications</h3>
              <div class="chip-group" style="margin-bottom:16px;">
                ${a.specs.map(sp=>`<span class="pill gold">${sp}</span>`).join('')}
                <span class="pill green">Academy Grad</span>
                <span class="pill">Background Checked</span>
              </div>

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                <div>
                  <h3 style="font-size:1rem;">Availability — next 28 days</h3>
                  <div class="mini-cal" style="margin-top:8px;">${miniCal}</div>
                  <div style="display:flex;gap:12px;margin-top:10px;font-size:0.8rem;color:var(--ink-500);">
                    <span><span style="display:inline-block;width:10px;height:10px;background:var(--ink-100);border-radius:3px;vertical-align:middle;"></span> Free</span>
                    <span><span style="display:inline-block;width:10px;height:10px;background:var(--gold-500);border-radius:3px;vertical-align:middle;"></span> Booked</span>
                    <span><span style="display:inline-block;width:10px;height:10px;background:var(--red);border-radius:3px;vertical-align:middle;opacity:0.65;"></span> Busy</span>
                  </div>
                </div>
                <div>
                  <h3 style="font-size:1rem;">Current assignment</h3>
                  ${ activeJob ? `
                    <div class="panel" style="margin-top:8px;">
                      <div class="panel-body">
                        <div class="small">${activeJob.ref}</div>
                        <strong>${activeJob.service}</strong>
                        <div class="small">${activeJob.customer} · ${fmtShort(activeJob.date)}</div>
                        <span class="st ${STAGE_BADGE[activeJob.stage]}" style="margin-top:6px;display:inline-block;">${STAGE_LABEL[activeJob.stage]}</span>
                      </div>
                    </div>
                  ` : `<p class="small">No active assignment.</p>` }

                  <h3 style="font-size:1rem;margin-top:16px;">Quick actions</h3>
                  <div style="display:flex;flex-direction:column;gap:6px;">
                    <button class="btn btn-primary" onclick="openEditPainter('${a.id}')">✏️ Edit details</button>
                    <button class="btn btn-outline" onclick="openArtisanMessage('${a.id}')">💬 Message ${a.name.split(' ')[0]}</button>
                    <button class="btn btn-outline" onclick="openArtisanCalendar('${a.id}')">📅 View full calendar</button>
                    <button class="btn btn-outline" onclick="openArtisanAssign('${a.id}')">📋 Assign new job</button>
                    <button class="btn btn-outline" onclick="toggleStatus('${a.id}')">🔄 Toggle availability</button>
                    <button class="btn btn-outline" onclick="removeFromRoster('${a.id}')" style="color:#8a1414;border-color:#fbdada;">🚪 Remove from roster</button>
                  </div>
                </div>
              </div>

              <h3 style="margin-top:24px;font-size:1rem;">Recent jobs</h3>
              <table class="tbl" style="border:1px solid var(--ink-100);border-radius:10px;overflow:hidden;">
                <thead><tr><th>Ref</th><th>Service</th><th>Customer</th><th>Date</th><th>Stage</th><th>Amount</th></tr></thead>
                <tbody>
                  ${jobs.slice(0,8).map(j => `
                    <tr><td><strong>${j.ref}</strong></td><td>${j.service}</td><td>${j.customer}</td><td>${fmtShort(j.date)}</td>
                    <td><span class="st ${STAGE_BADGE[j.stage]}">${STAGE_LABEL[j.stage]}</span></td><td>${fmtGHS(j.amount)}</td></tr>
                  `).join('') || '<tr><td colspan="6" class="small" style="text-align:center;padding:16px;">No jobs yet.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }
    function closeArt() {
      document.getElementById('artModal').classList.add('hidden');
      document.getElementById('artModal').innerHTML = '';
    }

    // ─────────────────────────────────────────
    // Edit Painter — admin form. Updates the local demo store and, when a
    // backend painter_profile id is known (numeric), also fires
    // PATCH /api/painters/:id so the change persists across containers.
    // ─────────────────────────────────────────
    function escAttr(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function openEditPainter(id) {
      const a = artisanById(id);
      if (!a) return;
      const host = document.getElementById('artModal');
      host.classList.remove('hidden');
      host.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeArt()">
          <div class="modal" style="max-width:560px;">
            <div class="modal-head">
              <div>
                <h3 style="margin:0;">Edit ${escAttr(a.name)}</h3>
                <div class="small" style="color:var(--ink-500);">Changes save to this dashboard; if the painter exists on the backend, the same fields PATCH there too.</div>
              </div>
              <div class="close-btn" onclick="closeArt()">✕</div>
            </div>
            <div class="modal-body">
              <div id="epAlert" style="display:none;background:#FEE2E2;border:1px solid #FCA5A5;color:#991B1B;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:0.86rem;"></div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div>
                  <label style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;">Name</label>
                  <input id="epName" type="text" value="${escAttr(a.name)}" style="width:100%;padding:9px 11px;border:1.5px solid var(--ink-300);border-radius:8px;font:inherit;font-size:0.92rem;" />
                </div>
                <div>
                  <label style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;">Phone</label>
                  <input id="epPhone" type="tel" value="${escAttr(a.phone || '')}" style="width:100%;padding:9px 11px;border:1.5px solid var(--ink-300);border-radius:8px;font:inherit;font-size:0.92rem;" />
                </div>
                <div style="grid-column:1/-1;">
                  <label style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;">Email</label>
                  <input id="epEmail" type="email" value="${escAttr(a.email || '')}" style="width:100%;padding:9px 11px;border:1.5px solid var(--ink-300);border-radius:8px;font:inherit;font-size:0.92rem;" />
                </div>
                <div>
                  <label style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;">Region / City</label>
                  <input id="epCity" type="text" value="${escAttr(a.region || a.city || '')}" style="width:100%;padding:9px 11px;border:1.5px solid var(--ink-300);border-radius:8px;font:inherit;font-size:0.92rem;" />
                </div>
                <div>
                  <label style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;">Years of experience</label>
                  <input id="epYears" type="number" min="0" max="60" value="${Number(a.years) || 0}" style="width:100%;padding:9px 11px;border:1.5px solid var(--ink-300);border-radius:8px;font:inherit;font-size:0.92rem;" />
                </div>
                <div>
                  <label style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;">Day rate (GHS)</label>
                  <input id="epRate" type="number" min="50" max="2000" value="${Number(a.rate) || 0}" style="width:100%;padding:9px 11px;border:1.5px solid var(--ink-300);border-radius:8px;font:inherit;font-size:0.92rem;" />
                </div>
                <div>
                  <label style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;">Commission rate (%)</label>
                  <input id="epCommission" type="number" min="0" max="100" step="1" value="${Number(a.commissionRate) || 90}" style="width:100%;padding:9px 11px;border:1.5px solid var(--ink-300);border-radius:8px;font:inherit;font-size:0.92rem;" />
                </div>
              </div>
              <div style="margin-top:14px;">
                <label style="display:block;font-size:0.78rem;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;">Bio (one line)</label>
                <textarea id="epBio" rows="2" style="width:100%;padding:9px 11px;border:1.5px solid var(--ink-300);border-radius:8px;font:inherit;font-size:0.92rem;resize:vertical;">${escAttr(a.bio || '')}</textarea>
              </div>
            </div>
            <div class="flex-between" style="padding:16px 20px;border-top:1px solid var(--ink-100);">
              <button class="btn btn-ghost" onclick="openArtisan('${a.id}')">← Cancel</button>
              <button class="btn btn-primary" onclick="savePainterEdits('${a.id}')">Save changes</button>
            </div>
          </div>
        </div>
      `;
    }

    async function savePainterEdits(id) {
      const a = artisanById(id); if (!a) return;
      const patch = {
        name:             document.getElementById('epName').value.trim(),
        phone:            document.getElementById('epPhone').value.trim(),
        email:            document.getElementById('epEmail').value.trim(),
        city:             document.getElementById('epCity').value.trim(),
        experience_years: Number(document.getElementById('epYears').value)      || 0,
        rate_per_day:     Number(document.getElementById('epRate').value)       || 0,
        bio:              document.getElementById('epBio').value.trim(),
      };
      const commission = Number(document.getElementById('epCommission').value);

      // Mirror onto the local demo record so the dashboard reflects the edit
      // immediately even without a backend round-trip.
      mutate(store => {
        const row = store.artisans.find(x => x.id === id);
        if (!row) return;
        row.name   = patch.name   || row.name;
        row.phone  = patch.phone  || row.phone;
        row.email  = patch.email  || row.email;
        row.region = patch.city   || row.region;
        row.city   = patch.city   || row.city;
        row.years  = patch.experience_years;
        row.rate   = patch.rate_per_day;
        row.bio    = patch.bio    || row.bio;
        if (Number.isFinite(commission)) row.commissionRate = commission;
        row.initials = row.name.split(/\s+/).filter(Boolean).slice(0,2).map(s => s[0].toUpperCase()).join('');
      });

      // Best-effort backend PATCH. Demo ids like 'a3' won't have a backing
      // painter_profiles row; the call fails harmlessly and we surface
      // whichever message the API returned.
      const apiId = a.backendId || a.painter_profile_id || (/^\d+$/.test(String(id)) ? id : null);
      if (apiId) {
        try {
          const t = (typeof pmAuth !== 'undefined' && pmAuth.token) ? pmAuth.token() : null;
          const res = await fetch(`/api/painters/${encodeURIComponent(apiId)}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', ...(t ? { 'Authorization': `Bearer ${t}` } : {}) },
            body: JSON.stringify(patch),
          });
          const j = await res.json().catch(() => ({}));
          if (!res.ok) {
            const alertHost = document.getElementById('epAlert');
            if (alertHost) {
              alertHost.style.display = 'block';
              alertHost.textContent = `Saved locally, but backend rejected the update: ${j && j.message ? j.message : ('HTTP ' + res.status)}`;
            }
            return;
          }
        } catch (e) {
          const alertHost = document.getElementById('epAlert');
          if (alertHost) {
            alertHost.style.display = 'block';
            alertHost.textContent = `Saved locally — backend not reachable (${e && e.message || 'unknown error'}).`;
          }
          return;
        }
      }

      if (typeof pmToast === 'function') pmToast(`${patch.name || a.name}'s details saved.`, 'success');
      else if (typeof toast === 'function') toast(`${patch.name || a.name}'s details saved.`);
      openArtisan(id);
      render();
    }
    function toggleStatus(id) {
      const a = getStore().artisans.find(x => x.id === id);
      if (!a) return;
      const next = a.status === 'available' ? 'on_job' : a.status === 'on_job' ? 'leave' : 'available';
      const NEXT_LABEL = { available: 'Available', on_job: 'On a job', leave: 'On leave' };
      if (!confirm(`Change ${a.name.split(' ')[0]}'s status from "${NEXT_LABEL[a.status]}" to "${NEXT_LABEL[next]}"?\n\nThis affects job assignment and visibility on the customer site.`)) return;
      mutate(store => {
        const row = store.artisans.find(x => x.id === id);
        row.status = next;
      });
      toast(`${a.name.split(' ')[0]} → ${NEXT_LABEL[next]} (click again to undo)`);
      openArtisan(id);
      render();
    }

    // ─────────────────────────────────────────────
    // Remove a Paint Master from the roster (soft-delete).
    //
    // Calls PUT /api/painters/:id/suspend so the backend's listing query
    // (which filters on suspended_at IS NULL) immediately hides them from
    // the customer-side search. The local admin store mirrors the change
    // by setting status='removed' so the change is visible without a
    // page reload. Fails open: if the backend is unreachable we still
    // update the local store and warn the user that the change is
    // demo-only until the server is back.
    // ─────────────────────────────────────────────
    async function removeFromRoster(id) {
      const a = getStore().artisans.find(x => x.id === id);
      if (!a) return;
      const first = a.name.split(' ')[0];
      if (!confirm(
        `Remove ${a.name} from the roster?\n\n` +
        `• Their profile will be hidden from customer search and quote assignment.\n` +
        `• Existing bookings, reviews and payouts stay intact.\n` +
        `• You can reinstate them later — this is not a permanent delete.`
      )) return;

      // Try the backend first. We use the numeric painter_profile id when we
      // have one (admin/artisans seeds use string ids like 'a3'); fall back
      // to whatever id the local store gave us.
      const apiId = a.painter_profile_id || a.user_id || id;
      let backendOk = false;
      try {
        const token = (typeof pmAuth !== 'undefined' && pmAuth.token) ? pmAuth.token() : null;
        const res = await fetch(`/api/painters/${encodeURIComponent(apiId)}/suspend`, {
          method:  'PUT',
          headers: token ? { 'Authorization': `Bearer ${token}` } : {},
        });
        backendOk = res.ok;
      } catch (_) { /* offline — local store still mutates below */ }

      mutate(store => {
        const row = store.artisans.find(x => x.id === id);
        if (!row) return;
        row.status      = 'removed';
        row.removed_at  = new Date().toISOString();
      });
      toast(backendOk
        ? `${first} removed from the roster.`
        : `${first} marked removed locally — backend unavailable, the change won't sync until it's back.`);
      closeArt();
      render();
    }

    // ─────────────────────────────────────────────
    // Sub-modal infrastructure for the painter quick actions. Lives in its own
    // host (#artSubModal) so closing returns the user to the still-open
    // artisan detail rather than the empty grid.
    // ─────────────────────────────────────────────
    function closeSubArt() {
      const h = document.getElementById('artSubModal');
      h.classList.add('hidden');
      h.innerHTML = '';
    }

    async function submitArtisanMessage(id) {
      const a = getStore().artisans.find(x => x.id === id); if (!a) return;
      const body = document.getElementById('amBody').value.trim();
      if (!body) { toast('Type a message first'); return; }
      const channel = document.querySelector('input[name="amCh"]:checked').value;
      const to = (channel === 'whatsapp') ? (a.whatsapp || a.phone) : a.phone;
      if ((channel === 'sms' || channel === 'whatsapp') && !to) {
        toast(`No ${channel === 'sms' ? 'phone' : 'WhatsApp'} number on file`);
        return;
      }
      const btn = document.getElementById('amSendBtn');
      btn.disabled = true; btn.textContent = 'Sending...';
      const res = await pmComms.send({
        channel, to, body,
        threadKey: 'artisan:' + a.id,
        platformPath: '/api/admin/painters/' + a.id + '/messages',
      });
      if (res.ok) {
        toast(res.receipt || 'Sent');
        closeSubArt();
      } else {
        btn.disabled = false; btn.textContent = 'Send';
        toast(res.error || 'Could not send');
      }
    }

      for (let i = 0; i < 28; i++) {

                ${padded.map(slot => {

                  const has = slot.jobs.length > 0;

    function assignJobTo(painterId, jobRef) {
      const painter = getStore().artisans.find(x => x.id === painterId); if (!painter) return;
      const job = getStore().jobs.find(j => j.ref === jobRef);
      mutate(store => {
        const j = store.jobs.find(x => x.ref === jobRef);
        if (!j) return;
        j.assignedTo = painterId;
        j.stage = 'dispatched';
        const p = store.artisans.find(x => x.id === painterId);
        if (p) p.status = 'on_job';
      });
      // Notify the painter via pmActivity. The target tag lets painter.html
      // filter their bell to events meant for them.
      if (typeof pmActivity !== 'undefined') {
        const actor = (typeof pmAuth !== 'undefined' && pmAuth.user()?.name) || 'Admin';
        pmActivity.emit({
          kind: 'booking',
          title: `New job assigned · ${jobRef}`,
          sub:   job ? `${job.service} · ${job.customer} · ${fmtShort(job.date)}${job.endDate && job.endDate !== job.date ? ' → ' + fmtShort(job.endDate) : ''}` : jobRef,
          source: { role: 'admin', name: actor },
          target: { role: 'painter', id: painterId, name: painter.name },
        });
      }
      toast(`${jobRef} assigned to ${painter.name.split(' ')[0]}`);
      closeSubArt();
      openArtisan(painterId);
      render();
    }

    // The auto-generated password is shown in a toast so the admin can SMS

    // ─────────────────────────────────────────────
    const PAINTER_COLORS = [
      '#16a085','#e67e22','#8e44ad','#c0392b','#2980b9',
      '#27ae60','#d35400','#1abc9c','#9b59b6','#34495e'
    ];
    function pickAvatarColor(seed) {
      let h = 0;
      for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
      return PAINTER_COLORS[h % PAINTER_COLORS.length];
    }
    function makeInitials(name) {
      return name.trim().split(/\s+/).map(s => s[0]).slice(0, 2).join('').toUpperCase();
    }
    function generatePassword() {
      // Same recipe as pmUsers.generatePassword in shared.js — keep them aligned.
      const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      const digits  = '23456789';
      let pwd = 'PM-';
      for (let i = 0; i < 3; i++) pwd += letters[Math.floor(Math.random() * letters.length)];
      pwd += '-';
      for (let i = 0; i < 4; i++) pwd += digits[Math.floor(Math.random() * digits.length)];
      return pwd;
    }

    async function submitAddPainter() {
      const errBox = document.getElementById('addErr');
      const showErr = (msg) => { errBox.textContent = msg; errBox.style.display = 'block'; };
      const hideErr = () => { errBox.style.display = 'none'; };
      hideErr();

      const name   = document.getElementById('newName').value.trim();
      const phone  = document.getElementById('newPhone').value.trim().replace(/\s+/g, '');
      const email  = document.getElementById('newEmail').value.trim();
      const region = document.getElementById('newRegion').value;
      const years  = parseInt(document.getElementById('newYears').value || '0', 10);
      const specs  = [...document.querySelectorAll('input[name="newSpec"]:checked')].map(c => c.value);

      if (!name)            return showErr('Please enter the painter\'s full name.');
      if (!phone)           return showErr('Please enter a phone number.');
      if (!region)          return showErr('Please select a region.');
      if (specs.length === 0) return showErr('Pick at least one specialty.');
      if (pmUsers.findByPhone(phone)) return showErr('A user with that phone already exists.');

      const btn = document.getElementById('addPainterBtn');
      btn.disabled = true; btn.textContent = 'Adding…';

      const password = generatePassword();
      const id       = 'a_' + Date.now().toString(36);

      // 1) Push into the in-memory roster used by this page.
      mutate(store => {
        store.artisans.unshift({
          id,
          name,
          color:    pickAvatarColor(name),
          initials: makeInitials(name),
          region,
          years:    isNaN(years) ? 0 : years,
          rating:   0,                    // no jobs yet
          specs:    specs.map(s => s.toLowerCase()),
          jobs:     0,
          status:   'available'
        });
        store.activity.unshift({
          kind:'dispatch', who: name, what: `added to the roster (${region})`, amount: null, t: Date.now()
        });
      });

      // 2) Add to pmUsers so the painter can sign in via the same store
      //    that login.html falls back to when the API is unreachable.
      //    mustChangePassword forces them through change-password.html on
      //    first sign-in so the temporary credential we generated isn't
      //    the long-term one.
      pmUsers.add({
        name, phone, email,
        role:    'painter',
        status:  'active',                // admin add — skip approvals queue
        region,
        password,
        mustChangePassword: true,
        meta: { addedBy: 'admin', specs }
      });

      // 3) Best-effort: try the real backend so the painter exists in the DB
      //    when the server is up. Falls through silently if not reachable.
      let backendOk = false;
      try {
        const r = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, email: email || undefined, password, role: 'painter' })
        });
        if (r.ok) backendOk = true;
      } catch (e) { /* offline / sandbox — fine */ }

      btn.disabled = false; btn.textContent = 'Add to roster';
      closeArt();
      render();

      // Show the credentials in a confirmation modal so the admin can copy
      // them. The painter changes their password on first sign-in.
      showCredentials({ name, phone, password, email, region, backendOk });
    }

    function showCredentials({ name, phone, password, email, region, backendOk }) {
      const host = document.getElementById('artModal');
      host.classList.remove('hidden');
      host.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeArt()">
          <div class="modal" style="max-width:480px;">
            <div class="modal-head">
              <div>
                <h3 style="margin:0;">Painter added ✓</h3>
                <div class="small" style="color:var(--ink-500);">${name} is now on the active roster${backendOk ? ' (backend + local).' : ' (local only — start the API to sync).'}</div>
              </div>
              <div class="close-btn" onclick="closeArt()">✕</div>
            </div>
            <div class="modal-body">
              <p style="margin-top:0;color:var(--ink-700);">SMS the painter these credentials so they can sign in. They'll be prompted to change the password on first login.</p>
              <div style="background:var(--ink-50);border:1px solid var(--ink-100);border-radius:10px;padding:14px;font-family:var(--font-display);">
                <div style="display:grid;grid-template-columns:90px 1fr;gap:8px 14px;font-size:0.92rem;">
                  <div style="color:var(--ink-500);">Phone</div><div><strong>${phone}</strong></div>
                  ${email ? `<div style="color:var(--ink-500);">Email</div><div><strong>${email}</strong></div>` : ''}
                  <div style="color:var(--ink-500);">Password</div><div><code style="background:#fff;padding:2px 6px;border-radius:4px;border:1px solid var(--ink-300);">${password}</code></div>
                  <div style="color:var(--ink-500);">Region</div><div>${region}</div>
                </div>
              </div>
              <div style="display:flex;gap:10px;margin-top:16px;">
                <button class="btn btn-primary" onclick="copyCreds('${phone}', '${password}')">📋 Copy SMS text</button>
                <button class="btn btn-outline" onclick="closeArt()">Done</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function copyCreds(phone, password) {
      const text = `Welcome to Paint Masters! Sign in at paintmasters.gh/login with phone ${phone} and temporary password ${password}. You'll change it on first sign-in.`;
      navigator.clipboard.writeText(text).then(
        () => toast('SMS text copied — paste into your messaging app.'),
        () => toast('Could not copy — please copy manually.', 'warn')
      );
    }

    // ─────────────────────────────────────────────
    // Message all — broadcast composer.
    // Pick a channel (SMS / email / WhatsApp), optionally filter the
    // recipients (all / available now / by region), write the message,
    // hit send. The simulated send logs to the activity feed and shows a
    // toast with the recipient count; a parallel best-effort POST goes to
    // the (future) backend at /api/admin/notifications/broadcast which
    // becomes live when notifications-outbox + the worker ship.
    // ─────────────────────────────────────────────
    function openMessageAll() {
      const s = getStore();
      const regionsSet = [...new Set(s.artisans.map(a => a.region))].sort();
      const host = document.getElementById('artModal');
      host.classList.remove('hidden');
      host.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeArt()">
          <div class="modal" style="max-width:560px;">
            <div class="modal-head">
              <div>
                <h3 style="margin:0;">Message all Paint Masters</h3>
                <div class="small" style="color:var(--ink-500);">Broadcast a message to your roster. Recipients see it on whichever channel you pick.</div>
              </div>
              <div class="close-btn" onclick="closeArt()">✕</div>
            </div>
            <div class="modal-body">
              <div class="alert err" id="msgErr" style="display:none;background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5;padding:10px 14px;border-radius:9px;margin-bottom:14px;font-size:0.88rem;"></div>

              <div style="display:grid;gap:14px;">
                <div>
                  <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--ink-700);margin-bottom:6px;">Channel <span style="color:var(--red);">*</span></label>
                  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;" id="msgChannels">
                    <label style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px solid var(--ink-300);border-radius:9px;cursor:pointer;font-size:0.86rem;font-weight:500;">
                      <input type="radio" name="msgChan" value="sms" checked /> 📱 SMS
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px solid var(--ink-300);border-radius:9px;cursor:pointer;font-size:0.86rem;font-weight:500;">
                      <input type="radio" name="msgChan" value="email" /> ✉️ Email
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px solid var(--ink-300);border-radius:9px;cursor:pointer;font-size:0.86rem;font-weight:500;">
                      <input type="radio" name="msgChan" value="whatsapp" /> 💬 WhatsApp
                    </label>
                  </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                  <div>
                    <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--ink-700);margin-bottom:4px;">Recipients</label>
                    <select id="msgFilter" style="width:100%;padding:10px 12px;border:1.5px solid var(--ink-300);border-radius:9px;font-size:0.92rem;font-family:inherit;background:#fff;">
                      <option value="all">All Paint Masters</option>
                      <option value="available">Only available now</option>
                      <option value="on_job">Only on a job</option>
                      ${regionsSet.map(r => `<option value="region:${r}">In ${r}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--ink-700);margin-bottom:4px;">Recipient count</label>
                    <input id="msgCount" type="text" readonly value="${s.artisans.length}" style="width:100%;padding:10px 12px;border:1.5px solid var(--ink-300);border-radius:9px;background:var(--ink-50);font-family:inherit;color:var(--ink-700);" />
                  </div>
                </div>

                <div id="msgSubjectField">
                  <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--ink-700);margin-bottom:4px;">Subject <span class="small" style="color:var(--ink-500);font-weight:400;">(email only)</span></label>
                  <input id="msgSubject" type="text" placeholder="e.g. Saturday training session — please confirm attendance" style="width:100%;padding:10px 12px;border:1.5px solid var(--ink-300);border-radius:9px;font-size:0.92rem;font-family:inherit;" />
                </div>

                <div>
                  <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--ink-700);margin-bottom:4px;">Message <span style="color:var(--red);">*</span></label>
                  <textarea id="msgBody" rows="5" placeholder="Hi team — quick reminder that all toolboxes need to be returned by Friday so we can run the audit. Thanks!" style="width:100%;padding:10px 12px;border:1.5px solid var(--ink-300);border-radius:9px;font-size:0.92rem;font-family:inherit;resize:vertical;"></textarea>
                  <div class="small" style="color:var(--ink-500);margin-top:4px;" id="msgCounter">0 characters · 0 SMS pages</div>
                </div>

                <div style="background:var(--ink-50);border:1px solid var(--ink-100);border-radius:10px;padding:12px 14px;font-size:0.82rem;color:var(--ink-700);line-height:1.5;">
                  📨 SMS goes out via Hubtel; email via the Resend integration when it ships. For now the broadcast is logged to the activity feed and queued — wire-up happens automatically once the backend's <code>notifications-outbox</code> worker is live.
                </div>
              </div>
            </div>
            <div class="modal-foot" style="display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--ink-100);">
              <button class="btn btn-outline" onclick="closeArt()">Cancel</button>
              <button class="btn btn-primary" id="msgSendBtn" onclick="submitMessageAll()">Send broadcast</button>
            </div>
          </div>
        </div>
      `;

      // Recompute the count when the channel/filter changes, and toggle the
      // subject field for SMS/WhatsApp (where there's no subject concept).
      function syncCount() {
        document.getElementById('msgCount').value = filterRecipients().length;
      }
      function syncSubject() {
        const ch = document.querySelector('input[name="msgChan"]:checked').value;
        document.getElementById('msgSubjectField').style.display = (ch === 'email') ? '' : 'none';
      }
      document.querySelectorAll('input[name="msgChan"]').forEach(el => {
        el.addEventListener('change', syncSubject);
      });
      document.getElementById('msgFilter').addEventListener('change', syncCount);
      document.getElementById('msgBody').addEventListener('input', (e) => {
        const len = e.target.value.length;
        const pages = Math.max(1, Math.ceil(len / 160));
        document.getElementById('msgCounter').textContent = `${len} characters · ${pages} SMS page${pages > 1 ? 's' : ''}`;
      });

      syncCount();
      syncSubject();
      setTimeout(() => document.getElementById('msgBody').focus(), 50);
    }

    // Apply the recipient filter to the live roster — used by the count
    // preview and by the actual send.
    function filterRecipients() {
      const filter = (document.getElementById('msgFilter') || {}).value || 'all';
      const list = getStore().artisans;
      if (filter === 'all')         return list;
      if (filter === 'available')   return list.filter(a => a.status === 'available');
      if (filter === 'on_job')      return list.filter(a => a.status === 'on_job');
      if (filter.startsWith('region:')) {
        const r = filter.slice(7);
        return list.filter(a => a.region === r);
      }
      return list;
    }

    async function submitMessageAll() {
      const errBox = document.getElementById('msgErr');
      const showErr = (m) => { errBox.textContent = m; errBox.style.display = 'block'; };
      errBox.style.display = 'none';

      const channel = document.querySelector('input[name="msgChan"]:checked').value;
      const subject = document.getElementById('msgSubject').value.trim();
      const body    = document.getElementById('msgBody').value.trim();
      const recipients = filterRecipients();

      if (!body)                                  return showErr('Please write a message.');
      if (channel === 'email' && !subject)        return showErr('Please add a subject for email broadcasts.');
      if (recipients.length === 0)                return showErr('No recipients match this filter.');

      const btn = document.getElementById('msgSendBtn');
      btn.disabled = true; btn.textContent = 'Sending…';

      // Best-effort backend broadcast. When the notifications-outbox worker
      // is live this enqueues one row per recipient and a worker dispatches.
      let backendOk = false;
      try {
        const r = await fetch('/api/admin/notifications/broadcast', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            channel, subject: channel === 'email' ? subject : undefined, body,
            painter_ids: recipients.map(a => a.id)
          })
        });
        if (r.ok) backendOk = true;
      } catch (e) { /* sandbox / offline */ }

      // Log to the local activity feed so the admin sees the broadcast in
      // the dashboard "What's happening" stream.
      mutate(store => {
        store.activity.unshift({
          kind:    'dispatch',
          who:     'You',
          what:    `${channel.toUpperCase()} broadcast to ${recipients.length} Master${recipients.length === 1 ? '' : 's'}: "${body.slice(0, 60)}${body.length > 60 ? '…' : ''}"`,
          amount:  null,
          t:       Date.now()
        });
      });

      btn.disabled = false; btn.textContent = 'Send broadcast';
      closeArt();
      toast(`${channel.toUpperCase()} sent to ${recipients.length} Paint Master${recipients.length === 1 ? '' : 's'}${backendOk ? '.' : ' (queued — backend will pick this up).'}`);
    }

    render();
  </script>
</body>
</html>
