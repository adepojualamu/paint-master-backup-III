<!doctype html>
<html lang="en">
<head>
  <meta name="pm-mode" content="production">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../assets/img/favicon.png" />
  <title>Job Board — Paint Masters Dispatcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/admin.css" />
  <style>
    /* Density toggle. Compact mode trims card padding, drops the customer/date
       meta line, and shrinks the avatar so a dispatcher can scan twice as many
       cards per column without scrolling. */
    body.jb-compact .job-card           { padding: 8px 10px; }
    body.jb-compact .job-card h4        { font-size: 0.86rem; margin: 4px 0; }
    body.jb-compact .job-card .meta     { display: none; }
    body.jb-compact .job-card .ref      { font-size: 0.7rem; }
    body.jb-compact .job-card .foot     { margin-top: 6px; padding-top: 6px; }
    body.jb-compact .job-card .avatar   { width: 18px !important; height: 18px !important; font-size: 0.55rem !important; }
    /* Stage chips row spacing */
    .chip-group .chip .count { font-size: 0.74rem; }

    .job-card { position: relative; }
    /* Loading / empty board states */
    .jb-state { padding: 28px; text-align: center; color: var(--ink-500); font-size: 0.92rem; }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div id="admin-sidebar"></div>
    <div class="admin-main">
      <div id="admin-topbar"></div>
      <div class="main">

        <div class="page-head">
          <div>
            <h1>Job Board</h1>
            <div class="sub">Live view of the bookings pipeline. Tick cards to bulk-assign a Paint Master, or open a card to assign or cancel.</div>
          </div>
          <div class="page-actions">
            <button class="btn btn-outline" onclick="selectAll()">☑ Select all</button>
            <button class="btn btn-outline" onclick="exportCSV()">⬇ Export CSV</button>
            <button class="btn btn-primary" onclick="loadBoard()">↺ Refresh</button>
          </div>
        </div>

        <!-- Offline / fallback banner — shown when the bookings API can't be
             reached and the board is rendering the localStorage demo data. -->
        <div id="jbBanner" style="display:none;align-items:center;gap:10px;background:#FEF3C7;border:1px solid #FCD34D;color:#92400E;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:0.88rem;">
          <span style="font-size:1rem;">⚠</span>
          <span class="jb-banner-msg" style="flex:1;"></span>
          <button class="btn btn-outline" style="padding:4px 10px;font-size:0.8rem;" onclick="loadBoard()">Retry</button>
        </div>

        <!-- Action-error alert — surfaces 401 / 403 / "Offline" so a click on
             Assign or Cancel that didn't go through never looks silent. -->
        <div id="jbActionAlert" style="display:none;align-items:center;gap:10px;background:#FEE2E2;border:1px solid #FCA5A5;color:#991B1B;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:0.9rem;"></div>

        <!-- Filters -->
        <div class="filterbar">
          <input type="search" id="jbSearch" placeholder="Search by ref, customer, service, address..." />
          <select class="sel" id="jbService">
            <option value="">All services</option>
          </select>
          <select class="sel" id="jbArtisan">
            <option value="">All Masters</option>
            <option value="null">Unassigned</option>
          </select>
          <select class="sel" id="jbCity" data-pm-regions='{"allLabel":"All cities"}'>
            <option value="">All cities</option>
          </select>
          <button class="btn btn-ghost" onclick="clearFilters()">Clear</button>
          <span class="small" style="margin-left:auto;" id="jbCount"></span>
        </div>

        <!-- Declutter row: stage chips (focus the board), hide-empty toggle,
             and a compact-density toggle. Selections persist for the session. -->
        <div class="filterbar" style="padding-top:0;flex-wrap:wrap;">
          <div class="chip-group" id="stageChips" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
          <label style="display:flex;align-items:center;gap:6px;font-size:0.86rem;color:var(--ink-700);margin-left:auto;cursor:pointer;">
            <input type="checkbox" id="hideEmpty" checked /> Hide empty stages
          </label>
          <label style="display:flex;align-items:center;gap:6px;font-size:0.86rem;color:var(--ink-700);cursor:pointer;">
            <input type="checkbox" id="compact" /> Compact cards
          </label>
        </div>

        <!-- Kanban. Columns are the real booking lifecycle statuses. Tick a
             card's checkbox to select it for a bulk action; click the card
             body to open the detail / assign modal. -->
        <div style="overflow-x:auto;">
          <div class="kanban" id="board"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Floating batch action bar — appears when 1+ cards are ticked. -->
  <div class="batch-bar" id="batchBar">
    <span class="count" id="batchCount">0 selected</span>
    <span class="sep"></span>
    <select id="batchAssign" title="Assign Paint Master">
      <option value="">Assign master…</option>
    </select>
    <button class="gold" onclick="batchAssign()">Assign →</button>
    <button onclick="batchCancel()" style="background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.86rem;">Cancel</button>
    <button class="clear" onclick="clearSelection()">✕</button>
  </div>

  <!-- Detail modal -->
  <div id="jobModal" class="hidden"></div>

  <script src="../assets/shared.js"></script>
  <script src="assets/admin-shared.js"></script>
  <script>
    // ============================================================
    // Job Board — live view of the bookings pipeline.
    //
    // Primary source is the backend: GET /api/bookings. Each booking is
    // mapped onto a kanban card; the columns ARE the real booking lifecycle
    // statuses, so there's no lossy stage mapping. The dispatcher can assign
    // a Paint Master (PUT /:id/assign) and cancel a booking (PUT /:id/cancel)
    // — the only two booking mutations the backend exposes to admins. The
    // remaining transitions (painter confirm, mark-done, QA approve/reject)
    // happen in the painter and QA workflows, so the board shows them
    // read-only.
    //
    // If the API can't be reached (server down, or not signed in as an
    // admin) the board falls back to the localStorage demo store so it still
    // renders something — read-only, with a banner explaining why.
    // ============================================================
    adminMount('jobs');
    pmRegions.populate(document.getElementById('jbCity'), '', { allLabel: 'All cities' });

    // ---- stage models ----------------------------------------------------
    // API mode: columns are the booking statuses verbatim.
    const API_STAGES = ['pending_assignment','pending','confirmed','in_progress','qa_pending','completed','cancelled'];
    const API_STAGE_LABEL = {
      pending_assignment: 'New · Unassigned',
      pending:            'Painter Assigned',
      confirmed:          'Confirmed',
      in_progress:        'In Progress',
      qa_pending:         'QA Pending',
      completed:          'Completed',
      cancelled:          'Cancelled',
    };
    // Fallback (demo) mode reuses STAGES / STAGE_LABEL from admin-shared.js.
    // render() reads only these two — loadBoard() swaps them per mode.
    let BOARD_STAGES      = API_STAGES;
    let BOARD_STAGE_LABEL = API_STAGE_LABEL;

    // ---- board state -----------------------------------------------------
    let apiMode = false;
    let board   = { jobs: [], artisans: [] };   // the active data source
    const selected = new Set();                  // ticked job ids (as strings)

    // Declutter prefs persist for the session so navigating away and back
    // doesn't reset the dispatcher's chosen view.
    const SESS_KEY = 'pm_jobs_view_v1';
    const prefs = (() => { try { return JSON.parse(sessionStorage.getItem(SESS_KEY)) || {}; } catch (e) { return {}; } })();
    const filters = {
      search:'', service:'', artisan:'', city:'',
      stage:     prefs.stage || '',
      hideEmpty: prefs.hideEmpty !== false,   // default true
      compact:   !!prefs.compact,
    };
    function savePrefs() {
      try { sessionStorage.setItem(SESS_KEY, JSON.stringify({ stage: filters.stage, hideEmpty: filters.hideEmpty, compact: filters.compact })); } catch (e) {}
    }

    // ---- helpers ---------------------------------------------------------
    function authHeaders() {
      const t = (typeof pmAuth !== 'undefined' && pmAuth.token) ? pmAuth.token() : null;
      return t ? { 'Authorization': `Bearer ${t}` } : {};
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function money(n) {
      try { if (typeof fmtGHS === 'function') return fmtGHS(n); } catch (e) {}
      return 'GH₵' + Math.round(Number(n) || 0).toLocaleString();
    }
    function shortDate(iso) {
      try { if (typeof fmtShort === 'function') return fmtShort(iso); } catch (e) {}
      if (!iso) return '—';
      try { return new Date(iso).toLocaleDateString('en-GB', { day:'2-digit', month:'short' }); }
      catch (e) { return String(iso); }
    }
    function notify(msg, kind) {
      if (typeof toast === 'function') toast(msg, kind);
      else if (typeof pmToast === 'function') pmToast(msg, kind);
    }
    function initialsOf(name) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '—';
      return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
    }
    const AVATAR_COLORS = ['#0B1F3A','#1B4D89','#C8102E','#2E5D3A','#B97A1F','#5C2A4C','#0072CE','#7A1C2C'];
    function colorFor(id) {
      const s = String(id == null ? '' : id);
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
      return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
    }
    // Loose id match — API painter ids are numbers, demo artisan ids strings.
    function artisanById(id) {
      if (id == null) return null;
      return (board.artisans || []).find(a => String(a.id) === String(id)) || null;
    }
    function requireApi() {
      if (!apiMode) {
        showActionError(
          'Offline — sign in as an admin (or restart the backend) to assign or cancel jobs.',
          'Reload signed-in'
        );
        return false;
      }
      return true;
    }

    // Sticky red alert above the batch bar — used for "your action did not
    // work and here is why". Survives until the dispatcher dismisses it or
    // does something else, so a silent 403/401/offline can never be missed.
    function showActionError(message, retryLabel) {
      const host = document.getElementById('jbActionAlert');
      if (!host) return;
      host.innerHTML = `
        <span style="font-size:1rem;">⚠</span>
        <span style="flex:1;">${esc(message)}</span>
        ${retryLabel ? `<button class="btn btn-outline" style="padding:4px 10px;font-size:0.8rem;" onclick="location.href='../login.html?next=admin/jobs.html'">${esc(retryLabel)}</button>` : ''}
        <button class="btn btn-ghost" style="padding:4px 8px;font-size:0.95rem;line-height:1;" onclick="document.getElementById('jbActionAlert').style.display='none';" aria-label="Dismiss">×</button>
      `;
      host.style.display = 'flex';
    }
    function clearActionError() {
      const host = document.getElementById('jbActionAlert');
      if (host) host.style.display = 'none';
    }

    // ---- mappers ---------------------------------------------------------
    // A backend booking → the kanban "job" shape render() expects.
    function bookingToJob(b) {
      let endDate = b.job_date;
      try {
        const d = new Date(b.job_date);
        d.setDate(d.getDate() + Math.max(0, (b.duration_days || 1) - 1));
        endDate = d.toISOString().slice(0, 10);
      } catch (e) {}
      return {
        id:            b.id,
        ref:           b.id,                       // bookings use their id as the ref
        customer:      b.customer_name || '—',
        service:       b.service || 'Painting',
        area:          Number(b.area_sqm) || 0,
        amount:        Number(b.total) || 0,
        stage:         b.status,
        assignedTo:    b.painter_id != null ? b.painter_id : null,
        painterName:   b.painter_name || null,
        date:          b.job_date,
        endDate:       endDate,
        durationDays:  b.duration_days || 1,
        address:       b.address || '—',
        paymentMethod: b.payment_method || null,
        paymentStatus: b.payment_status || null,
        quoteId:       b.quote_id || null,
        notes:         b.notes || null,
        createdAt:     b.created_at || null,
      };
    }
    // A backend painter → the kanban "artisan" shape.
    function painterToArtisan(p) {
      return {
        id:       p.id,
        name:     p.name,
        initials: initialsOf(p.name),
        color:    colorFor(p.id),
        region:   p.city || '—',
        rating:   p.avg_rating != null ? Number(p.avg_rating) : null,
        rate:     p.rate_per_day,
      };
    }

    // ---- data load -------------------------------------------------------
    // Fetch every page of bookings (admin sees all). Capped at 10 pages so a
    // runaway dataset can't hang the board.
    async function fetchAllBookings() {
      const out = [];
      for (let page = 1; page <= 10; page++) {
        const res = await fetch(`/api/bookings?limit=100&page=${page}`, { headers: authHeaders() });
        if (!res.ok) throw new Error('Bookings API: HTTP ' + res.status);
        const j = await res.json();
        const rows = Array.isArray(j.bookings) ? j.bookings : [];
        out.push(...rows);
        if (page >= (j.pages || 1)) break;
      }
      return out;
    }

    async function loadBoard() {
      const boardEl = document.getElementById('board');
      if (boardEl && !board.jobs.length) boardEl.innerHTML = '<div class="jb-state">Loading bookings…</div>';
      const banner = document.getElementById('jbBanner');
      try {
        const [bookings, paintersRes] = await Promise.all([
          fetchAllBookings(),
          fetch('/api/painters?limit=200', { headers: authHeaders() }),
        ]);
        if (!paintersRes.ok) throw new Error('Painters API: HTTP ' + paintersRes.status);
        const pj = await paintersRes.json();
        apiMode = true;
        BOARD_STAGES      = API_STAGES;
        BOARD_STAGE_LABEL = API_STAGE_LABEL;
        board = {
          jobs:     bookings.map(bookingToJob),
          artisans: (Array.isArray(pj.painters) ? pj.painters : []).map(painterToArtisan),
        };
        if (banner) banner.style.display = 'none';
      } catch (e) {
        // Graceful fallback — render the localStorage demo store, read-only.
        apiMode = false;
        BOARD_STAGES      = (typeof STAGES !== 'undefined') ? STAGES : API_STAGES;
        BOARD_STAGE_LABEL = (typeof STAGE_LABEL !== 'undefined') ? STAGE_LABEL : API_STAGE_LABEL;
        let demo = { jobs: [], artisans: [] };
        try { demo = (typeof getStore === 'function') ? getStore() : demo; } catch (_) {}
        board = {
          jobs:     (demo.jobs || []).filter(j => !j.deleted_at),
          artisans: demo.artisans || [],
        };
        if (banner) {
          banner.style.display = 'flex';
          const msg = banner.querySelector('.jb-banner-msg');
          if (msg) msg.textContent =
            'Offline — showing demo data. Couldn’t reach the bookings API (' + e.message +
            '). Sign in as an admin with the server running to manage live bookings.';
        }
      }
      selected.clear();
      populateFilters();
      render();
    }

    // Rebuild the service + master filter dropdowns for the active dataset.
    // The city dropdown is a static region list populated once by pmRegions.
    function populateFilters() {
      const svcSel = document.getElementById('jbService');
      const artSel = document.getElementById('jbArtisan');
      if (svcSel) {
        const services = [...new Set(board.jobs.map(j => j.service).filter(Boolean))].sort();
        svcSel.innerHTML = '<option value="">All services</option>'
          + services.map(s => `<option>${esc(s)}</option>`).join('');
        svcSel.value = filters.service;
      }
      if (artSel) {
        artSel.innerHTML = '<option value="">All Masters</option><option value="null">Unassigned</option>'
          + board.artisans.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');
        artSel.value = filters.artisan;
      }
    }

    // ---- render ----------------------------------------------------------
    function renderStageChips() {
      const host = document.getElementById('stageChips'); if (!host) return;
      const counts = BOARD_STAGES.reduce((m, st) => { m[st] = board.jobs.filter(j => j.stage === st).length; return m; }, {});
      const chip = (val, label, count) => {
        const active = filters.stage === val ? 'active' : '';
        return `<button class="chip ${active}" data-stage="${esc(val)}">${esc(label)} <span class="count" style="opacity:.7;font-weight:500;margin-left:4px;">${count}</span></button>`;
      };
      host.innerHTML = chip('', 'All', board.jobs.length)
        + BOARD_STAGES.map(st => chip(st, BOARD_STAGE_LABEL[st] || st, counts[st])).join('');
      host.querySelectorAll('[data-stage]').forEach(b => b.addEventListener('click', () => {
        filters.stage = filters.stage === b.dataset.stage ? '' : b.dataset.stage;
        savePrefs(); render();
      }));
    }

    function filteredJobs() {
      return board.jobs.filter(j => {
        if (filters.search) {
          const q = filters.search.toLowerCase();
          const hay = `${j.ref} ${j.customer} ${j.service} ${j.address}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        if (filters.service && j.service !== filters.service) return false;
        if (filters.artisan === 'null' && j.assignedTo) return false;
        else if (filters.artisan && filters.artisan !== 'null' && String(j.assignedTo) !== String(filters.artisan)) return false;
        if (filters.city && !String(j.address || '').includes(filters.city)) return false;
        return true;
      });
    }

    function masterAvatar(j) {
      const a = artisanById(j.assignedTo);
      if (a) {
        return `<div class="avatar" style="width:24px;height:24px;background:${a.color};font-size:0.65rem;" title="Master: ${esc(a.name)}">${esc(a.initials)}</div>`;
      }
      if (j.painterName) {
        return `<div class="avatar" style="width:24px;height:24px;background:${colorFor(j.assignedTo)};font-size:0.65rem;" title="Master: ${esc(j.painterName)}">${esc(initialsOf(j.painterName))}</div>`;
      }
      return '<span class="small" style="color:var(--ink-500);">No master</span>';
    }

    function renderCard(j) {
      const isSel = selected.has(String(j.id));
      return `
        <div class="job-card ${isSel ? 'selected' : ''}" data-id="${esc(j.id)}">
          <input type="checkbox" class="card-tick" data-id="${esc(j.id)}" ${isSel ? 'checked' : ''} aria-label="Select ${esc(j.ref)}" />
          <div data-open="${esc(j.id)}" style="cursor:pointer;">
            <div class="ref">${esc(j.ref)}</div>
            <h4 style="padding-right:30px;">${esc(j.service)}</h4>
            <div class="meta">${esc(j.customer)} · ${esc(shortDate(j.date))}</div>
            <div class="foot">
              ${masterAvatar(j)}
              <span class="amt">${money(j.amount)}</span>
            </div>
          </div>
        </div>`;
    }

    function render() {
      const filtered = filteredJobs();
      const countEl = document.getElementById('jbCount');
      if (countEl) countEl.textContent = `${filtered.length} of ${board.jobs.length} ${apiMode ? 'bookings' : 'jobs'}`;

      renderStageChips();

      const stagesToShow = filters.stage
        ? [filters.stage]
        : BOARD_STAGES.filter(st => !filters.hideEmpty || filtered.some(j => j.stage === st));

      const boardEl = document.getElementById('board');
      boardEl.innerHTML = stagesToShow.map(stage => {
        const col = filtered.filter(j => j.stage === stage);
        const cards = col.map(renderCard).join('');
        return `
          <div class="kanban-col" data-stage="${esc(stage)}">
            <div class="col-head"><span>${esc(BOARD_STAGE_LABEL[stage] || stage)}</span><span class="count">${col.length}</span></div>
            ${cards || '<div class="small" style="text-align:center;padding:12px 0;color:var(--ink-500);">No jobs at this stage</div>'}
          </div>`;
      }).join('') || `<div class="jb-state">${board.jobs.length ? 'No jobs match the current filters.' : 'No bookings yet.'}</div>`;

      bindCards();
      refreshBatchBar();
    }

    function bindCards() {
      document.querySelectorAll('.card-tick').forEach(cb => {
        cb.addEventListener('click', e => e.stopPropagation());
        cb.addEventListener('change', e => {
          const id = String(e.target.dataset.id);
          if (e.target.checked) selected.add(id); else selected.delete(id);
          const card = e.target.closest('.job-card');
          if (card) card.classList.toggle('selected', e.target.checked);
          refreshBatchBar();
        });
      });
      document.querySelectorAll('[data-open]').forEach(el => {
        el.addEventListener('click', () => openJob(el.dataset.open));
      });
    }

    // ---- batch action bar ------------------------------------------------
    function refreshBatchBar() {
      const bar = document.getElementById('batchBar');
      const n = selected.size;
      bar.classList.toggle('show', n > 0);
      document.getElementById('batchCount').textContent = n === 1 ? '1 selected' : `${n} selected`;
      const assignSel = document.getElementById('batchAssign');
      assignSel.innerHTML = '<option value="">Assign master…</option>'
        + board.artisans.map(a =>
            `<option value="${esc(a.id)}">${esc(a.name)}${a.region ? ' · ' + esc(a.region) : ''}</option>`
          ).join('');
    }

    function selectAll() {
      const visible = [...document.querySelectorAll('.card-tick')];
      const allSel = visible.length > 0 && visible.every(cb => cb.checked);
      visible.forEach(cb => {
        const id = String(cb.dataset.id);
        if (allSel) selected.delete(id); else selected.add(id);
      });
      render();
    }
    function clearSelection() { selected.clear(); render(); }

    // ---- backend mutations ----------------------------------------------
    async function assignBooking(bookingId, painterId) {
      const res = await fetch(`/api/bookings/${encodeURIComponent(bookingId)}/assign`, {
        method:  'PUT',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body:    JSON.stringify({ painter_id: Number(painterId) }),
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((j && j.message) || ('HTTP ' + res.status));
      return j;
    }
    async function cancelBooking(bookingId) {
      const res = await fetch(`/api/bookings/${encodeURIComponent(bookingId)}/cancel`, {
        method:  'PUT',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((j && j.message) || ('HTTP ' + res.status));
      return j;
    }

    // Bulk-assign every ticked booking that is still unassigned. Bookings
    // past pending_assignment can't be re-assigned through this endpoint, so
    // they're reported as skipped rather than silently ignored.
    async function batchAssign() {
      if (!requireApi()) return;
      const painterId = Number(document.getElementById('batchAssign').value);
      if (!painterId) { showActionError('Pick a Paint Master from the dropdown first.'); return; }
      const ids = [...selected];
      if (!ids.length) return;
      clearActionError();
      let ok = 0, skipped = 0, failed = 0, lastErr = '';
      for (const id of ids) {
        const job = board.jobs.find(j => String(j.id) === id);
        if (!job || job.stage !== 'pending_assignment') { skipped++; continue; }
        try { await assignBooking(id, painterId); ok++; }
        catch (e) { failed++; lastErr = e && e.message || 'unknown error'; }
      }
      if (ok)      notify(`${ok} booking${ok > 1 ? 's' : ''} assigned.`, 'success');
      if (skipped) notify(`${skipped} skipped — only unassigned bookings can be assigned here.`, 'warn');
      // Sticky banner so the dispatcher actually sees why the assign didn't
      // go through (the most common cause is the admin lacking the
      // `dispatcher` sub-role, which surfaces here as "Requires sub-role: …").
      if (failed)  showActionError(`Assignment failed for ${failed} booking${failed > 1 ? 's' : ''}: ${lastErr}`);
      await loadBoard();
    }

    async function batchCancel() {
      if (!requireApi()) return;
      const ids = [...selected];
      if (!ids.length) return;
      const cancellable = ids.filter(id => {
        const j = board.jobs.find(x => String(x.id) === id);
        return j && j.stage !== 'completed' && j.stage !== 'cancelled';
      });
      if (!cancellable.length) { showActionError('None of the selected bookings can be cancelled.'); return; }
      if (!confirm(`Cancel ${cancellable.length} booking${cancellable.length > 1 ? 's' : ''}? Refunds follow the cancellation policy.`)) return;
      clearActionError();
      let ok = 0, failed = 0, lastErr = '';
      for (const id of cancellable) {
        try { await cancelBooking(id); ok++; }
        catch (e) { failed++; lastErr = e && e.message || 'unknown error'; }
      }
      if (ok)     notify(`${ok} booking${ok > 1 ? 's' : ''} cancelled.`, 'success');
      if (failed) showActionError(`Cancellation failed for ${failed} booking${failed > 1 ? 's' : ''}: ${lastErr}`);
      await loadBoard();
    }

    // ---- detail modal ----------------------------------------------------
    function openJob(id) {
      const j = board.jobs.find(x => String(x.id) === String(id));
      if (!j) return;
      const a = artisanById(j.assignedTo);
      const canAssign = apiMode && j.stage === 'pending_assignment';
      const canCancel = apiMode && j.stage !== 'completed' && j.stage !== 'cancelled';
      const assignedLabel = a ? esc(a.name)
        : (j.painterName ? esc(j.painterName)
        : '<span style="color:var(--ink-500);">— unassigned —</span>');

      const picker = canAssign
        ? (board.artisans.map(m => `
            <div class="artisan-pick" onclick="assignFromModal('${esc(j.id)}','${esc(m.id)}')">
              <div class="avatar" style="background:${m.color};">${esc(m.initials)}</div>
              <div style="flex:1;">
                <strong>${esc(m.name)}</strong>
                <div class="small">${esc(m.region)}${m.rating ? ' · ★ ' + m.rating.toFixed(1) : ''}${m.rate ? ' · ' + esc(m.rate) + ' GHS/day' : ''}</div>
              </div>
            </div>`).join('') || '<div class="small" style="color:var(--ink-500);">No painters in the roster.</div>')
        : '';

      const host = document.getElementById('jobModal');
      host.classList.remove('hidden');
      host.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeJob()">
          <div class="modal" style="max-width:580px;">
            <div class="modal-head">
              <div>
                <div class="small">${esc(j.ref)}</div>
                <h3>${esc(j.service)}</h3>
              </div>
              <div class="close-btn" onclick="closeJob()">✕</div>
            </div>
            <div class="modal-body">
              <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
                <span class="pill" style="background:var(--ink-100);color:var(--navy-900);font-weight:700;">${esc(BOARD_STAGE_LABEL[j.stage] || j.stage)}</span>
                ${j.paymentStatus ? `<span class="pill">Payment: ${esc(j.paymentStatus)}</span>` : ''}
                ${j.quoteId ? `<span class="small" style="color:var(--ink-500);">Quote <span style="font-family:ui-monospace,Menlo,monospace;">${esc(j.quoteId)}</span></span>` : ''}
              </div>

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;">
                <div><div class="small">Customer</div><strong>${esc(j.customer)}</strong></div>
                <div><div class="small">Amount</div><strong>${money(j.amount)}</strong></div>
                <div><div class="small">Scheduled</div><strong>${esc(shortDate(j.date))}${j.endDate && j.endDate !== j.date ? ' → ' + esc(shortDate(j.endDate)) : ''}</strong></div>
                <div><div class="small">Area</div><strong>${esc(j.area)} m²</strong></div>
                <div style="grid-column:1/-1;"><div class="small">Address</div><strong>${esc(j.address)}</strong></div>
                ${j.notes ? `<div style="grid-column:1/-1;"><div class="small">Notes</div><div style="font-size:0.9rem;white-space:pre-wrap;">${esc(j.notes)}</div></div>` : ''}
              </div>

              <div class="small">Assigned Paint Master</div>
              <div style="padding:10px 14px;border:1px solid var(--ink-300);border-radius:10px;background:var(--ink-50);font-size:0.92rem;margin-bottom:4px;">
                ${assignedLabel}
              </div>

              ${canAssign ? `
                <h3 style="font-size:1rem;margin:18px 0 2px;">Assign a Paint Master</h3>
                <p class="small" style="color:var(--ink-500);">Picking a painter sends them a confirmation request and moves the booking to "Painter Assigned".</p>
                <div style="display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;margin-top:8px;">
                  ${picker}
                </div>`
              : (apiMode
                  ? `<p class="small" style="color:var(--ink-500);margin-top:8px;">Reassignment and stage changes happen through the painter and QA workflows — this board shows them read-only.</p>`
                  : `<p class="small" style="color:var(--ink-500);margin-top:8px;">Offline demo view — reconnect to the server to manage this booking.</p>`)}
            </div>
            <div class="flex-between" style="padding:16px 20px;border-top:1px solid var(--ink-100);">
              <button class="btn btn-ghost" onclick="closeJob()">Close</button>
              ${canCancel ? `<button class="btn btn-outline" style="color:var(--red);border-color:var(--red);" onclick="cancelFromModal('${esc(j.id)}')">Cancel booking</button>` : ''}
            </div>
          </div>
        </div>`;
    }
    function closeJob() {
      const m = document.getElementById('jobModal');
      m.classList.add('hidden');
      m.innerHTML = '';
    }

    async function assignFromModal(bookingId, painterId) {
      if (!requireApi()) return;
      clearActionError();
      try {
        const r = await assignBooking(bookingId, painterId);
        notify((r && r.message) || 'Painter assigned.', 'success');
        closeJob();
        await loadBoard();
      } catch (e) {
        showActionError(`Could not assign painter: ${e.message || 'unknown error'}`);
      }
    }
    async function cancelFromModal(bookingId) {
      if (!requireApi()) return;
      if (!confirm('Cancel this booking? The refund is calculated by the cancellation policy.')) return;
      clearActionError();
      try {
        const r = await cancelBooking(bookingId);
        notify((r && r.message) || 'Booking cancelled.', 'success');
        closeJob();
        await loadBoard();
      } catch (e) {
        showActionError(`Could not cancel booking: ${e.message || 'unknown error'}`);
      }
    }

    // ---- filters ---------------------------------------------------------
    document.getElementById('jbSearch').addEventListener('input',  e => { filters.search  = e.target.value; render(); });
    document.getElementById('jbService').addEventListener('change', e => { filters.service = e.target.value; render(); });
    document.getElementById('jbArtisan').addEventListener('change', e => { filters.artisan = e.target.value; render(); });
    document.getElementById('jbCity').addEventListener('change',    e => { filters.city    = e.target.value; render(); });
    function clearFilters() {
      filters.search = ''; filters.service = ''; filters.artisan = ''; filters.city = '';
      document.getElementById('jbSearch').value  = '';
      document.getElementById('jbService').value = '';
      document.getElementById('jbArtisan').value = '';
      document.getElementById('jbCity').value    = '';
      render();
    }

    // ---- declutter toggles ----------------------------------------------
    document.getElementById('hideEmpty').checked = filters.hideEmpty;
    document.getElementById('compact').checked   = filters.compact;
    document.getElementById('hideEmpty').addEventListener('change', e => {
      filters.hideEmpty = e.target.checked; savePrefs(); render();
    });
    document.getElementById('compact').addEventListener('change', e => {
      filters.compact = e.target.checked; savePrefs(); applyCompact(); render();
    });
    function applyCompact() {
      document.body.classList.toggle('jb-compact', filters.compact);
    }
    applyCompact();

    // ---- CSV export ------------------------------------------------------
    function exportCSV() {
      const header = ['ref','customer','service','area','amount','stage','master','date','address'];
      const rows = board.jobs.map(j => {
        const a = artisanById(j.assignedTo);
        const vals = [
          j.ref, j.customer, j.service, j.area, j.amount,
          (BOARD_STAGE_LABEL[j.stage] || j.stage),
          a ? a.name : (j.painterName || ''),
          j.date, j.address,
        ];
        return vals.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',');
      });
      const csv = [header.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'paintmasters-jobs.csv'; a.click();
      URL.revokeObjectURL(url);
      notify('CSV exported');
    }

    // ---- boot ------------------------------------------------------------
    async function init() {
      await loadBoard();
      // Deep-link: if the hash matches a job id, auto-open its modal.
      if (location.hash) {
        const id = decodeURIComponent(location.hash.slice(1));
        if (board.jobs.find(j => String(j.id) === id)) openJob(id);
      }
    }
    init();
  </script>
</body>
</html>
