<!doctype html>
<html lang="en">
<head>
  <meta name="pm-mode" content="production">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <title>Brand — Paint Masters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    /* ─────────────────────────────────────────────────────────
       Brand landing page — driven by ?brand=<slug> against pmBrands.
       Layout: hero → signature swatches strip → available paints
       → full colour palette → CTA. The brand's accent colour
       drives the hero gradient and a few accent rules below.
       ───────────────────────────────────────────────────────── */
    .brand-hero {
      position: relative;
      padding: 64px 24px 48px;
      overflow: hidden;
      background:
        radial-gradient(900px 400px at 88% -10%, var(--brand-accent-soft), transparent 60%),
        linear-gradient(180deg, #F7FAFD, #FFFFFF);
    }
    .brand-hero::after {
      /* faint kente echo on the right edge so the brand page still feels
         like Paint Masters, not the brand's own marketing site */
      content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 6px;
      background:
        repeating-linear-gradient(180deg,
          var(--brand-accent) 0 22px,
          var(--gold-500)     22px 32px,
          var(--navy-900)     32px 44px);
      opacity: 0.65;
    }
    .brand-hero-grid {
      max-width: var(--container); margin: 0 auto;
      display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px;
      align-items: center;
    }
    @media (max-width: 880px) {
      .brand-hero-grid { grid-template-columns: 1fr; gap: 28px; }
    }
    .brand-eyebrow {
      display: inline-block; font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--brand-accent); margin-bottom: 8px;
    }
    .brand-title {
      font-family: var(--font-display); font-size: clamp(2.2rem, 4vw + 1rem, 3.6rem);
      line-height: 1.05; margin: 0 0 14px; color: var(--navy-900);
      letter-spacing: -0.02em;
    }
    .brand-tagline { font-size: 1.15rem; color: var(--ink-700); margin: 0 0 18px; max-width: 56ch; }
    .brand-story   { color: var(--ink-700); max-width: 60ch; margin: 0 0 22px; }
    .brand-meta    { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .brand-meta .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      background: #fff; border: 1px solid var(--ink-100);
      font-size: 0.86rem; font-weight: 600; color: var(--ink-700);
    }
    .brand-meta .pill .dot {
      width: 8px; height: 8px; border-radius: 999px; background: var(--brand-accent);
    }
    .brand-cta-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .brand-cta-row .btn { padding: 12px 20px; }

    .brand-logo-card {
      background: #fff; border: 1px solid var(--ink-100);
      border-radius: var(--radius-lg); box-shadow: var(--shadow);
      padding: 36px; min-height: 240px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    .brand-logo-card img {
      max-height: 130px; max-width: 80%; object-fit: contain;
      filter: grayscale(0%); transition: transform 0.2s;
    }
    .brand-logo-card:hover img { transform: scale(1.03); }
    .brand-logo-wordmark {
      font-family: var(--font-display); font-size: 2.2rem; font-weight: 800;
      color: var(--navy-900); letter-spacing: -0.02em;
    }
    .brand-logo-card .surfaces {
      margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--ink-100);
      width: 100%; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--brand-accent);
    }

    .signature-strip {
      max-width: var(--container); margin: 0 auto;
      display: flex; gap: 0; padding: 0 24px;
    }
    .signature-strip .sig {
      flex: 1; height: 80px; display: flex; align-items: flex-end;
      padding: 10px; color: rgba(255,255,255,0.92);
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase;
      border-right: 1px solid rgba(255,255,255,0.16);
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    .signature-strip .sig:last-child { border-right: 0; }
    .signature-strip .sig.light { color: rgba(15,23,42,0.74); text-shadow: none; }

    /* ---- section titles ---- */
    .section { max-width: var(--container); margin: 0 auto; padding: 56px 24px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
    .section-head h2 { margin: 0; }
    .section-head .small { color: var(--ink-500); }

    /* ---- paint grid (reuses the .paint-card styles from paints.html) ---- */
    .paint-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
    }
    @media (max-width: 1000px) { .paint-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 760px)  { .paint-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px)  { .paint-grid { grid-template-columns: 1fr; } }
    .paint-card {
      background: #fff; border: 1px solid var(--ink-100);
      border-radius: 14px; overflow: hidden;
      display: flex; flex-direction: column;
      transition: transform 0.08s, box-shadow 0.18s, border-color 0.15s;
    }
    .paint-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--ink-300); }
    .paint-swatch { height: 96px; border-bottom: 1px solid var(--ink-100); position: relative; }
    .paint-swatch::after {
      content: ""; position: absolute; inset: auto 0 0 0; height: 4px;
      background: linear-gradient(90deg, transparent, rgba(0,0,0,0.10));
    }
    .paint-body { padding: 14px 16px; display: flex; flex-direction: column; flex: 1; }
    .paint-meta { display: flex; gap: 8px; align-items: center; font-size: 0.74rem; margin-bottom: 8px; flex-wrap: wrap; }
    .paint-brand-pill {
      background: var(--navy-900); color: #fff;
      padding: 3px 8px; border-radius: 999px;
      font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; font-size: 0.68rem;
    }
    .paint-finish { color: var(--ink-500); font-size: 0.74rem; }
    .paint-card strong {
      display: block; font-family: var(--font-display); font-weight: 700;
      color: var(--navy-900); font-size: 1.02rem; line-height: 1.25;
    }
    .paint-card p { margin: 6px 0 0; font-size: 0.84rem; color: var(--ink-700); flex: 1; }
    .paint-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--ink-100); }
    .paint-size { font-size: 0.78rem; color: var(--ink-500); }
    .paint-cta { font-size: 0.85rem; font-weight: 700; color: var(--navy-900); text-decoration: none; }
    .paint-cta:hover { color: var(--brand-accent); }

    /* ---- colour palette ---- */
    .palette-grid {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px;
    }
    @media (max-width: 1000px) { .palette-grid { grid-template-columns: repeat(6, 1fr); } }
    @media (max-width: 760px)  { .palette-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 420px)  { .palette-grid { grid-template-columns: repeat(3, 1fr); } }
    .palette-tile {
      background: #fff; border: 1px solid var(--ink-100);
      border-radius: var(--radius-sm); overflow: hidden;
      cursor: pointer; transition: transform 0.08s, box-shadow 0.18s, border-color 0.15s;
      display: flex; flex-direction: column;
    }
    .palette-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--ink-300); }
    .palette-swatch { aspect-ratio: 1.1 / 1; }
    .palette-meta { padding: 8px 10px 10px; }
    .palette-name { display: block; font-size: 0.84rem; font-weight: 700; color: var(--navy-900); }
    .palette-hex  { display: block; font-size: 0.72rem; color: var(--ink-500); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; margin-top: 2px; }

    /* ---- palette modal ---- */
    .pal-modal-back {
      position: fixed; inset: 0; background: rgba(11,31,58,0.5);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 16px;
    }
    .pal-modal-back.show { display: flex; }
    .pal-modal {
      background: #fff; border-radius: var(--radius-lg);
      max-width: 460px; width: 100%; box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .pal-modal-swatch { height: 180px; }
    .pal-modal-body  { padding: 22px 24px 24px; }
    .pal-modal h3    { margin: 0 0 4px; }
    .pal-modal .hex  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 0.95rem; color: var(--ink-500); }
    .pal-modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .pal-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--navy-900); color: #fff;
      padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 0.92rem;
      box-shadow: var(--shadow);
      opacity: 0; transition: opacity 0.18s, transform 0.18s;
      z-index: 1100; pointer-events: none;
    }
    .pal-toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

    /* ---- bottom CTA card ---- */
    .brand-cta-card {
      max-width: var(--container); margin: 0 auto 60px; padding: 36px 24px;
      background: linear-gradient(135deg, var(--navy-900), var(--navy-700));
      color: #fff; border-radius: var(--radius-lg);
      display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; align-items: center;
    }
    @media (max-width: 760px) { .brand-cta-card { grid-template-columns: 1fr; } }
    .brand-cta-card h3 { color: #fff; margin: 0 0 8px; font-size: 1.6rem; }
    .brand-cta-card p  { color: rgba(255,255,255,0.85); margin: 0; }
    .brand-cta-card .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    @media (max-width: 760px) { .brand-cta-card .actions { justify-content: flex-start; } }

    /* ---- not-found / fallback ---- */
    .brand-missing {
      max-width: 720px; margin: 80px auto; padding: 0 24px; text-align: center;
    }

    /* ---- Caparol-only product gallery (renders below the paint grid for
            ?brand=caparol). Image is a marketing infographic, framed cleanly
            with a body strip underneath for category + sizes + CTA. ---- */
    .caparol-gallery-head {
      display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap;
      gap:12px; margin-bottom: 18px;
    }
    .caparol-gallery-head h2 { margin: 0; }
    .caparol-gallery-head .small { color: var(--ink-500); }
    .caparol-gallery-anchor-pill {
      display:inline-block; background: linear-gradient(135deg,var(--gold-500),var(--gold-400));
      color: var(--navy-900); font-size: 0.62rem; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 3px 10px; border-radius: 999px; margin-right: 10px;
      vertical-align: 0.18em;
    }
    .caparol-product-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px;
    }
    @media (max-width: 1000px) { .caparol-product-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 620px)  { .caparol-product-grid { grid-template-columns: 1fr; } }

    .caparol-product-card {
      background: #fff; border: 1px solid var(--ink-100); border-radius: var(--radius-lg);
      overflow: hidden; display: flex; flex-direction: column;
      transition: transform 0.12s, box-shadow 0.18s, border-color 0.15s;
    }
    .caparol-product-card:hover {
      transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--brand-accent);
    }
    .caparol-product-image-btn {
      all: unset; cursor: zoom-in; display: block; width: 100%;
      background: #f4f6f8; aspect-ratio: 4 / 5; overflow: hidden;
    }
    .caparol-product-image-btn img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.4s ease;
    }
    .caparol-product-card:hover .caparol-product-image-btn img { transform: scale(1.02); }
    .caparol-product-image-btn:focus-visible {
      outline: 3px solid var(--brand-accent); outline-offset: -3px;
    }

    .caparol-product-body { padding: 16px 18px 18px; display:flex; flex-direction:column; gap:6px; }
    .caparol-product-category {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--brand-accent);
    }
    .caparol-product-body h3 { margin: 0; font-size: 1.12rem; color: var(--navy-900); }
    .caparol-product-body p  { margin: 0; font-size: 0.92rem; color: var(--ink-700); line-height: 1.5; }
    .caparol-product-foot {
      display:flex; justify-content:space-between; align-items:center;
      margin-top: 8px; padding-top: 12px; border-top: 1px dashed var(--ink-100);
    }
    .caparol-product-sizes { font-size: 0.82rem; font-weight: 700; color: var(--ink-700); }
    .caparol-product-cta {
      font-size: 0.86rem; font-weight: 700; color: var(--brand-accent);
      text-decoration: none;
    }
    .caparol-product-cta:hover { text-decoration: underline; }

    /* ---- Caparol lightbox (click image to enlarge spec sheet) ---- */
    #caparol-lightbox {
      position: fixed; inset: 0; background: rgba(11,31,58,0.88);
      display: flex; align-items: center; justify-content: center;
      z-index: 2000; padding: 24px;
    }
    #caparol-lightbox[hidden] { display: none; }
    #caparol-lightbox figure {
      margin: 0; max-width: min(94vw, 720px); max-height: 92vh;
      display: flex; flex-direction: column; gap: 10px; align-items: center;
    }
    #caparol-lightbox img {
      max-width: 100%; max-height: 84vh; height: auto; border-radius: var(--radius-lg);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4); background: #fff;
    }
    #caparol-lightbox figcaption {
      color: #fff; font-weight: 700; letter-spacing: 0.04em;
    }
    .caparol-lightbox-close {
      position: absolute; top: 18px; right: 22px;
      background: rgba(255,255,255,0.12); border: 0; color: #fff;
      width: 42px; height: 42px; border-radius: 999px;
      font-size: 1.8rem; line-height: 1; cursor: pointer;
    }
    .caparol-lightbox-close:hover { background: rgba(255,255,255,0.22); }
  </style>
</head>
<body>
  <div id="pm-nav"></div>

  <main id="brandMain">
    <!-- Filled by the bootstrap script below. If the brand slug is missing,
         we fall back to the not-found state. -->
  </main>

  <div id="pm-footer"></div>

  <!-- Modal for the colour-palette tile click -->
  <div class="pal-modal-back" id="palModal" role="dialog" aria-modal="true" aria-labelledby="palModalName">
    <div class="pal-modal">
      <div class="pal-modal-swatch" id="palModalSwatch"></div>
      <div class="pal-modal-body">
        <h3 id="palModalName">Colour</h3>
        <span class="hex" id="palModalHex">#000000</span>
        <p class="small mt-12" id="palModalSurface" style="color:var(--ink-500);"></p>
        <div class="pal-modal-actions">
          <button class="btn btn-primary" id="palCopyBtn">Copy hex</button>
          <a class="btn btn-gold" id="palQuoteBtn" href="quote.html">Use in a quote →</a>
          <button class="btn btn-ghost" id="palCloseBtn">Close</button>
        </div>
      </div>
    </div>
  </div>
  <div class="pal-toast" id="palToast" role="status" aria-live="polite">Copied</div>

  <script src="assets/shared.js"></script>
  <script src="assets/paint-catalog.js"></script>
  <script>
    pmMountLayout('paints');

    // ----- pick the brand from ?brand= ------------------------------------
    const params = new URLSearchParams(location.search);
    const slug   = (params.get('brand') || '').toLowerCase().trim();
    const brand  = (typeof pmBrands !== 'undefined') ? pmBrands.bySlug(slug) : null;

    const main = document.getElementById('brandMain');

    if (!brand) {
      main.innerHTML = `
        <section class="brand-missing">
          <span class="eyebrow">Brand not found</span>
          <h1 class="mt-16">${slug ? `We don’t have a page for "${slug}" yet.` : 'Pick a paint brand to explore.'}</h1>
          <p>Browse all our partner brands, or jump back to the homepage to see the full lineup.</p>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px;">
            <a class="btn btn-primary" href="paints.html">Browse all paints</a>
            <a class="btn btn-ghost"   href="index.html">Back to home</a>
          </div>
        </section>
      `;
    } else {
      // Tint the page with the brand's accent. We compute a soft (low-alpha)
      // version for the hero gradient by parsing the hex.
      const accent = brand.accent || '#0B1F3A';
      const soft = hexToSoft(accent, 0.16);
      document.documentElement.style.setProperty('--brand-accent',      accent);
      document.documentElement.style.setProperty('--brand-accent-soft', soft);

      const paints  = pmBrands.paintsFor(brand.slug);
      const palette = brand.palette || [];

      // Pick the top 5 palette colours as the signature strip.
      const sig = palette.slice(0, 5);

      main.innerHTML = `
        <section class="brand-hero">
          <div class="brand-hero-grid">
            <div>
              <span class="brand-eyebrow">${brand.featured ? '★ Featured anchor partner' : 'Trusted partner brand'}</span>
              <h1 class="brand-title">${esc(brand.name)}</h1>
              <p class="brand-tagline">${esc(brand.tagline || '')}</p>
              <p class="brand-story">${esc(brand.story || '')}</p>
              <div class="brand-meta">
                ${brand.surfaces ? `<span class="pill"><span class="dot"></span>${esc(brand.surfaces)}</span>` : ''}
                <span class="pill"><span class="dot"></span>${paints.length} paint${paints.length===1?'':'s'} in stock</span>
                <span class="pill"><span class="dot"></span>${palette.length} curated colour${palette.length===1?'':'s'}</span>
              </div>
              <div class="brand-cta-row">
                <a class="btn btn-gold"  href="#palette">See the colour palette →</a>
                <a class="btn btn-ghost" href="quote.html?brand=${encodeURIComponent(brand.slug)}">Start a quote</a>
              </div>
            </div>
            <div class="brand-logo-card">
              <img src="${esc(brand.logo || '')}"
                   alt="${esc(brand.name)} logo"
                   onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'brand-logo-wordmark',textContent:${JSON.stringify(brand.name)}}))" />
              <span class="surfaces">${esc(brand.surfaces || '')}</span>
            </div>
          </div>
        </section>

        ${sig.length ? `
          <div class="signature-strip" aria-label="${esc(brand.name)} signature colours">
            ${sig.map(c => `
              <div class="sig ${isLight(c.hex) ? 'light' : ''}" style="background:${c.hex};" title="${esc(c.name)}">${esc(c.name)}</div>
            `).join('')}
          </div>
        ` : ''}

        <section class="section">
          <div class="section-head">
            <h2>Paints we stock from ${esc(brand.name)}</h2>
            <span class="small">Click any paint to start a quote with it.</span>
          </div>
          ${paints.length ? `
            <div class="paint-grid">
              ${paints.map(renderPaint).join('')}
            </div>
          ` : `
            <div class="empty-result show" style="display:block;text-align:center;padding:32px 0;color:var(--ink-500);">
              <strong style="display:block;color:var(--navy-900);font-size:1.1rem;margin-bottom:6px;">Catalog coming soon.</strong>
              <p>We use ${esc(brand.name)} on jobs but haven’t added their full SKU list to the browse view yet. <a href="quote.html?brand=${encodeURIComponent(brand.slug)}" style="color:var(--brand-accent);font-weight:700;">Start a quote</a> and your Paint Master will recommend the right finish.</p>
            </div>
          `}
        </section>

        ${brand.slug === 'caparol' && typeof PM_CAPAROL_GALLERY !== 'undefined' ? `
          <section class="section" id="caparol-products">
            <div class="caparol-gallery-head">
              <h2>
                <span class="caparol-gallery-anchor-pill">★ Anchor Partner</span>
                Caparol product range — straight from the manufacturer
              </h2>
              <span class="small">Tap any image to enlarge the spec sheet. Pricing happens inside your quote.</span>
            </div>
            <div class="caparol-product-grid">
              ${PM_CAPAROL_GALLERY.map(pmRenderCaparolProductCard).join('')}
            </div>
          </section>
        ` : ''}

        <section class="section" id="palette">
          <div class="section-head">
            <h2>Colour palette</h2>
            <span class="small">Tap any swatch to copy the hex or pull it into a quote.</span>
          </div>
          ${palette.length ? `
            <div class="palette-grid">
              ${palette.map((c, i) => `
                <button type="button" class="palette-tile" data-i="${i}" aria-label="${esc(c.name)} ${esc(c.hex)}">
                  <span class="palette-swatch" style="background:${c.hex};"></span>
                  <span class="palette-meta">
                    <span class="palette-name">${esc(c.name)}</span>
                    <span class="palette-hex">${esc(c.hex)}</span>
                  </span>
                </button>
              `).join('')}
            </div>
          ` : `<p class="small">Curated palette coming soon.</p>`}
        </section>

        ${brand.featured && brand.featuredCopy ? `
          <section class="section" style="background:linear-gradient(180deg,rgba(245,184,0,0.08),transparent);border-radius:var(--radius-lg);">
            <div class="section-head">
              <h2><span style="background:var(--gold-500);color:var(--navy-900);font-size:0.7rem;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;vertical-align:middle;margin-right:10px;">★ Featured Partner</span> ${esc(brand.featuredCopy.whyHeading)}</h2>
            </div>
            <p style="color:var(--ink-700);max-width:64ch;font-size:1.02rem;line-height:1.7;">${esc(brand.featuredCopy.whyBody)}</p>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px;">
              ${(brand.featuredCopy.perks || []).map(p => `
                <div style="background:#fff;border:1px solid var(--ink-100);border-radius:var(--radius);padding:20px 22px;">
                  <div style="font-size:1.6rem;line-height:1;">${esc(p.icon || '★')}</div>
                  <strong style="display:block;font-family:var(--font-display);color:var(--navy-900);font-size:1.05rem;margin:10px 0 6px;">${esc(p.title)}</strong>
                  <p style="margin:0;font-size:0.92rem;color:var(--ink-700);line-height:1.55;">${esc(p.body)}</p>
                </div>
              `).join('')}
            </div>
          </section>
        ` : ''}

        <section class="brand-cta-card">
          <div>
            <h3>Ready to paint with ${esc(brand.name)}?</h3>
            <p>Pick a colour above (or let your Paint Master suggest one) and we’ll quote labour, materials and travel up front. Cashless, escrowed, and warranty-backed.${brand.featured ? ' <strong>This brand carries our extended 18-month warranty.</strong>' : ''}</p>
          </div>
          <div class="actions">
            <a class="btn btn-gold" href="quote.html?brand=${encodeURIComponent(brand.slug)}">Get a quote →</a>
            <a class="btn btn-ghost" href="paints.html" style="color:#fff;border-color:rgba(255,255,255,0.4);">Browse all paints</a>
          </div>
        </section>
      `;

      // Wire Caparol lightbox if the gallery rendered.
      if (brand.slug === 'caparol' && typeof pmInitCaparolLightbox === 'function') {
        pmInitCaparolLightbox();
      }

      // Wire palette clicks → modal.
      const modal = document.getElementById('palModal');
      const mSwatch = document.getElementById('palModalSwatch');
      const mName   = document.getElementById('palModalName');
      const mHex    = document.getElementById('palModalHex');
      const mSurf   = document.getElementById('palModalSurface');
      const copyBtn = document.getElementById('palCopyBtn');
      const quoteBtn= document.getElementById('palQuoteBtn');
      const closeBtn= document.getElementById('palCloseBtn');
      const toast   = document.getElementById('palToast');
      let active = null;

      function openColour(c) {
        active = c;
        mSwatch.style.background = c.hex;
        mName.textContent = c.name;
        mHex.textContent  = c.hex;
        mSurf.textContent = c.surface ? `Best for: ${c.surface}` : '';
        quoteBtn.href = `quote.html?brand=${encodeURIComponent(brand.slug)}&colour=${encodeURIComponent(c.hex)}&colourName=${encodeURIComponent(c.name)}`;
        modal.classList.add('show');
      }
      function closeColour() { modal.classList.remove('show'); active = null; }

      document.querySelectorAll('.palette-tile').forEach(t => {
        t.addEventListener('click', () => openColour(palette[Number(t.dataset.i)]));
      });
      closeBtn.addEventListener('click', closeColour);
      modal.addEventListener('click', e => { if (e.target === modal) closeColour(); });
      window.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('show')) closeColour(); });

      copyBtn.addEventListener('click', async () => {
        if (!active) return;
        try {
          await navigator.clipboard.writeText(active.hex);
          showToast(`Copied ${active.hex}`);
        } catch {
          // Older browsers / file:// — fall back to a hidden textarea.
          const ta = document.createElement('textarea');
          ta.value = active.hex; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); showToast(`Copied ${active.hex}`); }
          catch { showToast('Copy failed'); }
          ta.remove();
        }
      });

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove('show'), 1400);
      }
    }

    // ─────────── helpers ───────────
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function renderPaint(p) {
      return `
        <div class="paint-card" data-brand="${esc(p.brand)}" data-surface="${esc(p.surface)}" data-sku="${esc(p.sku)}">
          <div class="paint-swatch" style="background:${esc(p.swatch)};"></div>
          <div class="paint-body">
            <div class="paint-meta">
              <span class="paint-brand-pill">${esc(p.brand)}</span>
              <span class="paint-finish">${esc(p.finish)}</span>
            </div>
            <strong>${esc(p.name)}</strong>
            <p>${esc(p.note || '')}</p>
            <div class="paint-foot">
              <span class="paint-size">${esc(p.size)}</span>
              <a href="quote.html?paint=${encodeURIComponent(p.sku)}" class="paint-cta">Use in quote →</a>
            </div>
          </div>
        </div>`;
    }
    function hexToSoft(hex, alpha) {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
      if (!m) return `rgba(11,31,58,${alpha})`;
      const r = parseInt(m[1],16), g = parseInt(m[2],16), b = parseInt(m[3],16);
      return `rgba(${r},${g},${b},${alpha})`;
    }
    function isLight(hex) {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
      if (!m) return false;
      const r = parseInt(m[1],16), g = parseInt(m[2],16), b = parseInt(m[3],16);
      // YIQ luminance — if > 170, the swatch is light enough that white text is unreadable.
      return (r*0.299 + g*0.587 + b*0.114) > 170;
    }
  </script>
</body>
