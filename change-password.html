<!doctype html>
<html lang="en">
<head>
  <meta name="pm-mode" content="production">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <title>Change Password — Paint Masters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--ink-50); padding: 24px;
    }
    .cp-card {
      width: 100%; max-width: 460px;
      background: #fff; border-radius: 18px;
      padding: 30px 28px;
      box-shadow: 0 12px 32px rgba(11,31,58,0.06), 0 2px 6px rgba(11,31,58,0.04);
      border: 1px solid var(--ink-100);
    }
    .cp-card h2 { margin: 0 0 6px; font-size: 1.5rem; }
    .cp-card .lede { color: var(--ink-500); font-size: 0.92rem; margin-bottom: 22px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--ink-700); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--ink-300);
      border-radius: 10px; font-size: 0.96rem; font-family: inherit; background: #fff;
    }
    .field input:focus { outline: 0; border-color: var(--navy-700); box-shadow: 0 0 0 4px rgba(46,112,201,0.12); }
    .field .hint { font-size: 0.78rem; color: var(--ink-500); margin-top: 5px; }
    .alert { padding: 10px 14px; border-radius: 9px; margin-bottom: 16px; font-size: 0.88rem; display: none; }
    .alert.show { display: block; }
    .alert.err  { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }
    .alert.info { background: #DBEAFE; color: #1E3A8A; border: 1px solid #93C5FD; }
    .btn-submit {
      width: 100%; padding: 13px; border: 0; border-radius: 11px;
      background: var(--navy-900); color: #fff;
      font-size: 0.98rem; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-submit:hover { background: var(--navy-800); }
    .btn-submit:disabled { opacity: 0.6; cursor: wait; }
    .greeting {
      padding: 12px 14px; border-radius: 9px; margin-bottom: 18px;
      background: var(--gold-100); border: 1px solid #F2D04A; color: #6B4F00;
      font-size: 0.85rem;
    }
    .greeting strong { display: block; color: #4D3800; margin-bottom: 2px; }
  </style>
</head>
<body>

  <main class="cp-card">
    <h2>Set your password</h2>
    <p class="lede" id="cpLede">Welcome to Paint Masters. Please choose a new password — your temporary one expires after this step.</p>

    <div class="greeting" id="cpGreet" style="display:none;"></div>

    <div class="alert err"  id="cpErr"></div>
    <div class="alert info" id="cpInfo"></div>

    <form id="cpForm" novalidate>
      <div class="field">
        <label for="newPwd">New password</label>
        <input id="newPwd" type="password" autocomplete="new-password" placeholder="At least 6 characters" required />
        <div class="hint">Tip: a phrase you'll remember + one digit is easier than a random string.</div>
      </div>
      <div class="field">
        <label for="confirmPwd">Confirm new password</label>
        <input id="confirmPwd" type="password" autocomplete="new-password" placeholder="Type it again" required />
      </div>

      <button type="submit" class="btn-submit" id="cpSubmit">Save and continue →</button>
    </form>
  </main>

  <script src="assets/shared.js"></script>
  <script>
    // Member-only page. pmRequireAuth's own redirect logic skips this page
    // (matching the path) so we don't loop. If the user lands here without a
    // session, bounce to login. If they land here without the must-change
    // flag, send them straight on — the page is only meaningful in the
    // "first sign-in" state.
    const me = pmAuth.user();
    if (!me) {
      location.replace('login.html?next=change-password.html');
    }

    const params = new URLSearchParams(location.search);
    const nextRaw = params.get('next') || '';
    function safeNext(raw) {
      if (!raw) return null;
      try { raw = decodeURIComponent(raw); } catch (e) {}
      if (raw === 'admin') return 'admin/index.html';
      if (/^https?:\/\//i.test(raw) || raw.startsWith('//')) return null;
      if (raw.includes('..')) return null;
      return raw.replace(/^\/+/, '');
    }
    const nextPath = safeNext(nextRaw);

    const errBox  = document.getElementById('cpErr');
    const infoBox = document.getElementById('cpInfo');
    const greet   = document.getElementById('cpGreet');

    if (me) {
      const firstName = (me.name || 'there').split(' ')[0];
      // Tailor the greeting based on whether this is a forced first-sign-in
      // change or a voluntary one.
      if (me.mustChangePassword) {
        greet.style.display = 'block';
        greet.innerHTML = `<strong>Hi ${firstName} — you're using a temporary password.</strong>
          Setting a new one now keeps your account secure. After this you'll head to your dashboard.`;
      } else {
        document.getElementById('cpLede').textContent =
          'Choose a new password. After saving you\'ll be returned to where you were.';
      }
    }

    document.getElementById('cpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      const newPwd = document.getElementById('newPwd').value;
      const confirm = document.getElementById('confirmPwd').value;
      if (newPwd.length < 6)   { errBox.textContent = 'Password must be at least 6 characters.'; errBox.classList.add('show'); return; }
      if (newPwd !== confirm)  { errBox.textContent = 'Passwords don\'t match.'; errBox.classList.add('show'); return; }

      const btn = document.getElementById('cpSubmit');
      btn.disabled = true; btn.textContent = 'Saving…';
      const result = await pmAuth.changePassword({ newPassword: newPwd });
      if (!result.ok) {
        errBox.textContent = result.error || 'Could not change password.';
        errBox.classList.add('show');
        btn.disabled = false; btn.textContent = 'Save and continue →';
        return;
      }
      // Success — go to ?next= or the role-appropriate home. Painters
      // land on painter.html (their dashboard), admins on the admin
      // console, customers on my.html. This stops a painter being sent
      // to the customer dashboard right after their first sign-in,
      // which would feel like the platform "forgot" they're a Master.
      const homeForRole = (role) => {
        if (role === 'admin')   return 'admin/index.html';
        if (role === 'painter') return 'painter.html';
        return 'my.html';
      };
      const target = nextPath || homeForRole(result.user.role);
      location.replace(target);
    });
  </script>
</body>
</html>
